name: Match TCGplayer product IDs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/map_tcgplayer_ids.py'
      - 'scripts/build_market_prices.py'
      - 'price-references.json'
  schedule:
    - cron: '30 5 * * *'
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/map_tcgplayer_ids.py
      - run: python scripts/build_market_prices.py
      - name: Save verified mappings and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcgplayer-product-ids.json tcgplayer-mapping-report.json prices.json tcgplayer-price-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified TCGplayer product IDs"
            git push
          fi
